<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 03 - Seguridad y Contraste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background: #f8f9fa; transition: 0.3s; }
        body.alto-contraste { background: #000 !important; color: #fff !important; }
        body.alto-contraste .card { background: #111 !important; border: 2px solid #facc15 !important; color: #fff !important; }
        body.alto-contraste .btn { background: #facc15 !important; color: #000 !important; }
    </style>
</head>
<body>
    <main class="container mt-5">
        <h1>Fase 03: Seguridad y Alto Contraste</h1>
        
        <div class="card p-4 mt-4">
            <h3>Prueba de Contraste</h3>
            <p>Activa el modo de alto contraste para verificar la legibilidad.</p>
            <button id="btnAltoContraste" class="btn btn-dark">Alternar Alto Contraste</button>
        </div>
        
        <a href="../index.html" class="btn btn-secondary mt-4">Volver al Menú</a>
    </main>

    <script>
        document.getElementById('btnAltoContraste').addEventListener('click', () => {
            document.body.classList.toggle('alto-contraste');
        });
    </script>
</body>
</html>
