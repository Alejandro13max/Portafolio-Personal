<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 01 - DOM y Semántica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background: #f8f9fa; }
        :focus-visible { outline: 3px solid #8e24aa; outline-offset: 2px; }
    </style>
</head>
<body>
    <main class="container mt-5">
        <h1>Fase 01: DOM y Semántica HTML5</h1>
        <p>Esta sección prueba el uso correcto de etiquetas semánticas y auditoría en vivo.</p>
        
        <article class="card p-4 mt-4">
            <h3>Ejemplo de Artículo</h3>
            <p>El contenido está estructurado con header, main, section y article.</p>
            <button id="btnAuditarA11Y" class="btn btn-primary">Verificar Semántica HTML5</button>
            <p id="reporteA11Y" class="mt-3 text-success fw-bold"></p>
        </article>
        
        <a href="../index.html" class="btn btn-secondary mt-4">Volver al Menú</a>
    </main>

    <script>
        document.getElementById('btnAuditarA11Y').addEventListener('click', () => {
            const zonas = document.querySelectorAll('header, nav, main, article, footer, section').length;
            const sinAlt = document.querySelectorAll('img:not([alt]), img[alt=""]').length;
            const labels = document.querySelectorAll('label[for]').length;
            document.getElementById('reporteA11Y').textContent = 
                `Auditoría: ${zonas} etiquetas semánticas | Imágenes sin alt: ${sinAlt} | Labels: ${labels}.`;
        });
    </script>
</body>
</html>
