<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 02 - Eventos y Teclado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .caja-nav { padding: 20px; background: #e9ecef; border-radius: 10px; margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
        .caja-nav:focus { border-color: #8e24aa; outline: none; background: #f8f9fa; }
    </style>
</head>
<body>
    <main class="container mt-5">
        <h1>Fase 02: Manejo de Eventos y Teclado</h1>
        <p>Usa las flechas (Arriba/Abajo) de tu teclado para navegar por estas cajas.</p>
        
        <section class="mt-4">
            <div class="caja-nav" tabindex="0">Caja 1 (Presiona flecha abajo)</div>
            <div class="caja-nav" tabindex="0">Caja 2 (Presiona flecha arriba o abajo)</div>
            <div class="caja-nav" tabindex="0">Caja 3 (Presiona flecha arriba)</div>
        </section>
        
        <a href="../index.html" class="btn btn-secondary mt-4">Volver al Menú</a>
    </main>

    <script>
        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                const cajas = Array.from(document.querySelectorAll('.caja-nav'));
                const index = cajas.indexOf(document.activeElement);
                
                if (index > -1) {
                    e.preventDefault();
                    let nextIndex = index;
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextIndex = Math.min(index + 1, cajas.length - 1);
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') nextIndex = Math.max(index - 1, 0);
                    cajas[nextIndex].focus();
                }
            }
        });
    </script>
</body>
</html>
